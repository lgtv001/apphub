<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AppHub — Ecosistema SSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <script>
    // Pedido 2026-08-14: mismo mecanismo que login.html -- si venimos de kpis-sso con
    // ?tema= (botón "Volver a apphub"), aplicarlo antes de leer el override guardado.
    var temaEntrante = new URLSearchParams(location.search).get('tema');
    if (temaEntrante === 'light' || temaEntrante === 'dark') {
      localStorage.setItem('apphub_theme_override', temaEntrante);
    } else if (temaEntrante === 'auto') {
      localStorage.removeItem('apphub_theme_override');
    }
    if (temaEntrante) window.history.replaceState({}, '', location.pathname);
    var t = localStorage.getItem('apphub_theme_override');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  </script>
  <style>
    /*
      Consistente con el rediseño "Sala de control" de login.html (mismos tokens/fuentes) --
      este panel es la pantalla siguiente en el mismo flujo, así que hereda la identidad en vez
      de introducir una paleta nueva. La nota vieja decía "comprometida a tema oscuro a
      propósito" -- eso cambió 2026-08-14, mismo pedido y misma estructura de 3 niveles que
      login.html (ver comentario ahí, y kpis-sso/public/dashboard.html).
    */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0c;
      --surface: #131316;
      --surface2: #191a1e;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --accent: #ff9142;
      --accent-ink: #ff9142;
      --accent2: #3fd6d6;
      --accent-deep: #e0611c;
      --accent-glow: rgba(255,145,66,0.22);
      --text: #f2f0ea;
      --muted: #8c8c92;
      --muted2: #55555c;
      --success: #4fd18a;
      --success-glow: rgba(79,209,138,0.16);
      --font-head: 'IBM Plex Sans Condensed', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
      --radius: 14px;
      --radius-sm: 7px;
      --grid-color: rgba(255,145,66,0.045);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f2ee; --surface: #ffffff; --surface2: #ecebe6;
        --border: rgba(10,10,12,0.10); --border-strong: rgba(10,10,12,0.20);
        --accent: #ff9142; --accent-ink: #b84e0e; --accent2: #036e94; --accent-deep: #e0611c;
        --accent-glow: rgba(255,145,66,0.22);
        --text: #1a1a1c; --muted: #5c5c62; --muted2: #b8b6b0;
        --success: #1a7f4a; --success-glow: rgba(26,127,74,0.14);
        --grid-color: rgba(255,145,66,0.045);
      }
    }
    :root[data-theme="light"] {
      --bg: #f4f2ee; --surface: #ffffff; --surface2: #ecebe6;
      --border: rgba(10,10,12,0.10); --border-strong: rgba(10,10,12,0.20);
      --accent: #ff9142; --accent-ink: #b84e0e; --accent2: #036e94; --accent-deep: #e0611c;
      --accent-glow: rgba(255,145,66,0.22);
      --text: #1a1a1c; --muted: #5c5c62; --muted2: #b8b6b0;
      --success: #1a7f4a; --success-glow: rgba(26,127,74,0.14);
      --grid-color: rgba(255,145,66,0.045);
    }
    :root[data-theme="dark"] {
      --bg: #0a0a0c; --surface: #131316; --surface2: #191a1e;
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.16);
      --accent: #ff9142; --accent-ink: #ff9142; --accent2: #3fd6d6; --accent-deep: #e0611c;
      --accent-glow: rgba(255,145,66,0.22);
      --text: #f2f0ea; --muted: #8c8c92; --muted2: #55555c;
      --success: #4fd18a; --success-glow: rgba(79,209,138,0.16);
      --grid-color: rgba(255,145,66,0.045);
    }

    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 46px 46px;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    a { color: inherit; }

    /* ── Nav ──────────────────────────────────────────────── */
    .nav {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; }
    .brand-text { font-family: var(--font-head); font-weight: 700; font-size: 16px; }
    .brand-sub {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--muted);
      letter-spacing: 0.07em; text-transform: uppercase; margin-top: 2px;
    }
    .nav-right { display: flex; align-items: center; gap: 22px; }
    .tema-selector { display: inline-flex; gap: 2px; }
    .tema-opcion {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0;
      background: none; border: 1px solid var(--border); border-radius: 7px;
      color: var(--muted); cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .tema-opcion:hover { background: var(--surface2); color: var(--text); }
    .tema-opcion.active { background: var(--accent-glow); border-color: var(--accent); color: var(--text); }
    .tema-opcion:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .nav-link {
      font-size: 13px; color: var(--muted); text-decoration: none;
      border-bottom: 1px solid transparent; transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--accent2); border-color: var(--accent2); }
    .session { text-align: right; }
    .session .name { font-size: 13px; font-weight: 500; }
    .session .role {
      display: flex; align-items: center; gap: 5px; justify-content: flex-end;
      font-family: var(--font-mono); font-size: 10px; color: var(--success);
      letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-glow); }
    .btn-ghost-sm {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
      color: var(--muted); background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 13px; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost-sm:hover { color: var(--text); border-color: var(--border-strong); }

    /* ── Main ─────────────────────────────────────────────── */
    .main { position: relative; z-index: 1; padding: 52px 40px 72px; max-width: 1040px; margin: 0 auto; }

    .badge-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,145,66,0.1); border: 1px solid rgba(255,145,66,0.28);
      border-radius: 100px; padding: 6px 14px;
      font-family: var(--font-mono); font-size: 11px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase; color: #ffb27a;
      margin-bottom: 22px; animation: fadeUp 0.5s ease both;
    }
    .badge-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

    h1 {
      font-family: var(--font-head); font-weight: 700; font-size: 34px;
      letter-spacing: -0.01em; text-wrap: balance;
      animation: fadeUp 0.5s 0.06s ease both;
    }
    .sub {
      font-size: 14.5px; line-height: 1.6; color: var(--muted); margin-top: 10px; max-width: 60ch;
      animation: fadeUp 0.5s 0.12s ease both;
    }

    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 36px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 22px 22px 20px; cursor: pointer; text-align: left;
      font-family: inherit; color: inherit; width: 100%;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s, background 0.2s;
      animation: fadeUp 0.5s 0.18s ease both;
    }
    .card:not(.disabled):hover,
    .card:not(.disabled):focus-visible {
      border-color: var(--accent); background: var(--surface2);
      transform: translateY(-2px); box-shadow: 0 10px 30px -12px var(--accent-glow);
    }
    .card:focus-visible { outline: none; }
    .card.disabled { cursor: default; opacity: 0.58; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .icon-bezel {
      width: 42px; height: 42px; border-radius: 9px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
    }
    .card.disabled .icon-bezel { color: var(--muted2); }
    .icon-bezel svg { width: 21px; height: 21px; }

    .readout {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
      padding: 4px 9px; border-radius: 100px; text-transform: uppercase; white-space: nowrap;
    }
    .readout.ok { color: var(--success); background: var(--success-glow); }
    .readout.warn { color: var(--muted); background: var(--surface2); border: 1px solid var(--border); }

    .card h3 { font-family: var(--font-head); font-weight: 600; font-size: 17px; margin-top: 16px; }
    .card p { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; max-width: 42ch; }
    .card-code {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--muted2);
      margin-top: 14px; letter-spacing: 0.03em; font-variant-numeric: tabular-nums;
    }

    .grid[data-placeholder] { min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .grid[data-placeholder] .grid-status {
      grid-column: 1 / -1; font-family: var(--font-mono); font-size: 12px; color: var(--muted2);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="brand">
      <img src="/assets/img/logo-sso.png" alt="Logo Ecosistema SSO"/>
      <div>
        <div class="brand-text">AppHub</div>
        <div class="brand-sub">Ecosistema SSO — El Abra</div>
      </div>
    </div>
    <div class="nav-right">
      <a href="/app/selector-proyecto.html" class="nav-link">AppHub interno</a>
      <div class="session">
        <div class="name" id="user-name"></div>
        <div class="role"><span class="status-dot"></span>Sesión activa</div>
      </div>
      <button class="btn-ghost-sm" id="btn-logout" type="button">Cerrar sesión</button>
      <div class="tema-selector" role="group" aria-label="Tema del sitio">
        <button type="button" class="tema-opcion" data-tema="light" title="Claro" aria-label="Tema claro"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.3" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.7v2M10 15.3v2M17.3 10h-2M4.7 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button type="button" class="tema-opcion" data-tema="dark" title="Oscuro" aria-label="Tema oscuro"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.3 12.4A6.8 6.8 0 017.6 3.7 7 7 0 1016.3 12.4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        <button type="button" class="tema-opcion" data-tema="auto" title="Sistema" aria-label="Seguir el tema del sistema"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 3a7 7 0 010 14z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </nav>

  <div class="main">
    <span class="badge-pill"><span class="badge-dot"></span>Panel · Selección de sistema</span>
    <h1>Aplicaciones</h1>
    <p class="sub">Elegí con qué app querés trabajar. El acceso a cada sistema depende de los permisos que te otorgó el superusuario.</p>

    <div class="grid" id="apps-grid" data-placeholder>
      <span class="grid-status">Cargando aplicaciones…</span>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getUser, apiGet, apiPost, clearSession } from '/assets/js/api.js';
    import { initSelectorTema } from '/assets/js/theme.js';

    requireAuth();
    initSelectorTema();
    document.getElementById('user-name').textContent = getUser()?.nombre ?? '';
    document.getElementById('btn-logout').addEventListener('click', () => {
      clearSession();
      window.location.href = '/app/login.html';
    });

    const ICONOS = {
      'kpis-sso': '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M12 20V4M20 20V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
      'tarjetas-verdes': '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      'vcc': '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      'higiene-seguridad': '<svg viewBox="0 0 24 24" fill="none"><path d="M4 16a8 8 0 0116 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2 16h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 8v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    };
    const ICONO_DEFAULT = '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>';

    // La API todavía no expone descripción por app (solo codigo/nombre/proximamente) --
    // se mantiene acá, del lado del cliente, para no forzar una migración de schema por un
    // cambio que era puramente visual. Si se agrega `descripcion` en el backend más adelante,
    // usar esa en vez de este mapa.
    const DESCRIPCIONES = {
      'kpis-sso': 'Panel de indicadores de seguridad ocupacional: TRIR, incidentes y exposición.',
      'tarjetas-verdes': 'Seguimiento de tarjetas verdes de seguridad en terreno.',
      'vcc': 'Seguimiento de cumplimiento VCC.',
      'higiene-seguridad': 'Exámenes ocupacionales y control de higiene.',
    };

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function cargar() {
      const { data } = await apiGet('/launcher/aplicaciones');
      const grid = document.getElementById('apps-grid');

      if (!data.length) {
        grid.innerHTML = '<span class="grid-status">No tenés aplicaciones habilitadas todavía.</span>';
        return;
      }

      grid.removeAttribute('data-placeholder');

      grid.innerHTML = data.map((app, i) => `
        <button type="button" class="card ${app.proximamente ? 'disabled' : ''}" data-codigo="${escHtml(app.codigo)}" ${app.proximamente ? 'disabled' : ''}>
          <div class="card-top">
            <div class="icon-bezel">${ICONOS[app.codigo] ?? ICONO_DEFAULT}</div>
            <span class="readout ${app.proximamente ? 'warn' : 'ok'}">${app.proximamente ? 'Próximamente' : 'Disponible'}</span>
          </div>
          <h3>${escHtml(app.nombre)}</h3>
          ${DESCRIPCIONES[app.codigo] ? `<p>${escHtml(DESCRIPCIONES[app.codigo])}</p>` : ''}
          <div class="card-code">SYS/${String(i + 1).padStart(2, '0')} · ${escHtml(app.codigo)}</div>
        </button>
      `).join('');

      grid.querySelectorAll('.card:not(.disabled)').forEach((card) => {
        card.addEventListener('click', async () => {
          // Manda el tema actual (o null si está en "sistema", sin override) -- el backend
          // no puede leer localStorage por su cuenta, ver LauncherController::entrar.
          // 'auto' explícito (no null) cuando no hay override -- el backend ya lo trata igual
          // (ver LauncherController::entrar), pero mandarlo así de entrada es más claro que
          // depender de que null termine cayendo en el mismo default en dos lugares distintos.
          const temaActual = document.documentElement.getAttribute('data-theme') || 'auto';
          const { url } = await apiPost(`/launcher/aplicaciones/${card.dataset.codigo}/entrar`, { tema: temaActual });
          window.location.href = url;
        });
      });
    }

    cargar();
  </script>
</body>
</html>
