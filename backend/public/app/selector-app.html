<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AppHub — Aplicaciones</title>
  <script>
    var t = localStorage.getItem('apphub_theme_override');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  </script>
  <link rel="stylesheet" href="/assets/css/app.css"/>
  <style>
    .app-card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      cursor: pointer;
    }
    .app-icon {
      width: 48px; height: 48px; border-radius: 10px;
      background: rgba(79,126,255,0.1);
      border: 1px solid rgba(79,126,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .app-info h3 { margin-bottom: 4px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:12px">
      <a class="navbar-brand" href="/app/selector-proyecto.html">AppHub</a>
      <span class="text-muted" style="font-size:12px">›</span>
      <span id="proyecto-nombre" style="font-size:13px;color:var(--text-muted)"></span>
    </div>
    <div class="navbar-user">
      <span id="user-name" class="text-muted"></span>
      <a href="/app/selector-proyecto.html" class="btn btn-ghost btn-sm">Cambiar proyecto</a>
      <div class="tema-selector" role="group" aria-label="Tema del sitio">
        <button type="button" class="tema-opcion" data-tema="light" title="Claro" aria-label="Tema claro"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.3" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.7v2M10 15.3v2M17.3 10h-2M4.7 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button type="button" class="tema-opcion" data-tema="dark" title="Oscuro" aria-label="Tema oscuro"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.3 12.4A6.8 6.8 0 017.6 3.7 7 7 0 1016.3 12.4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        <button type="button" class="tema-opcion" data-tema="auto" title="Sistema" aria-label="Seguir el tema del sistema"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 3a7 7 0 010 14z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>Aplicaciones</h1>
        <p class="subtitle mt-8">Elige la app con la que deseas trabajar</p>
      </div>
    </div>

    <div class="cards-grid" style="max-width:700px;display:grid;grid-template-columns:1fr 1fr;gap:16px">

      <div class="card card-selectable app-card" id="app-quiebre">
        <div class="app-icon">📋</div>
        <div class="app-info">
          <h3>Quiebre del Contrato</h3>
          <p class="subtitle">Gestión de la jerarquía de ítems del contrato: áreas, subáreas, sistemas y subsistemas.</p>
        </div>
      </div>

      <div class="card card-selectable app-card" id="app-dashboard">
        <div class="app-icon">📊</div>
        <div class="app-info">
          <h3>Dashboard</h3>
          <p class="subtitle">Avance constructivo, cronograma Gantt y métricas generales del proyecto.</p>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { requireAuth, getUser } from '/assets/js/api.js';
    import { initSelectorTema } from '/assets/js/theme.js';
    initSelectorTema();

    requireAuth();

    const proyectoId     = sessionStorage.getItem('proyecto_id');
    const proyectoNombre = sessionStorage.getItem('proyecto_nombre');

    if (!proyectoId) {
      window.location.href = '/app/selector-proyecto.html';
    }

    document.getElementById('proyecto-nombre').textContent = proyectoNombre ?? '';
    document.getElementById('user-name').textContent       = getUser()?.nombre ?? '';

    document.getElementById('app-quiebre').addEventListener('click', () => {
      window.location.href = '/app/quiebre.html';
    });

    document.getElementById('app-dashboard').addEventListener('click', () => {
      window.location.href = `/app/dashboard.html?proyecto_id=${proyectoId}`;
    });
  </script>
</body>
</html>
